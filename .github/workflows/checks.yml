name: checks

on:
  pull_request:
    branches:
      - main
    # "edited" matters: editing a PR title must re-run the title check.
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  lint-markdown:
    name: lint-markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint the docs folder
        run: npx --yes markdownlint-cli2@0.24.0 "docs/**/*.md"

  lint-yaml:
    name: lint-yaml
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: python -m pip install yamllint==1.38.0

      - name: Lint the config folder
        run: yamllint config

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install commitlint
        run: npm install --no-save --ignore-scripts @commitlint/cli@20 @commitlint/config-conventional@20

      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint
